# Static Vite client + Express/Socket.IO game server (PM2: spot-the-song → :3500)
# Frontend: /var/www/spot-the-song.samirrodriguez.click
# API:      proxy /api → 127.0.0.1:3500
# Socket:   proxy /socket.io → 127.0.0.1:3500
# Health:   proxy /health → 127.0.0.1:3500
#
# First deploy installs this HTTP config, then certbot adds SSL.
# Do not overwrite this file after certbot has added the certificate blocks.

server {
    listen 80;
    server_name spot-the-song.samirrodriguez.click;

    root /var/www/spot-the-song.samirrodriguez.click;
    index index.html;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
